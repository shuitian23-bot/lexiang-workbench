 <div class=\"pc-img\"><div class=\"scr\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"pc-b\">\n        <span class=\"pc-hot\">${PROD.hot}<\u002Fspan>\n        <div class=\"pc-name\">${PROD.name}<\u002Fdiv>\n        <div class=\"pc-spec\">${PROD.spec}<\u002Fdiv>\n        <div class=\"pc-price\">${PROD.price}<small> 起<\u002Fsmall><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"replay\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 12a9 9 0 1 0 3-6.7M3 4v4h4\"/><\u002Fsvg>重放<\u002Fbutton>\n  <\u002Fdiv>`;\n\nconst panel = document.querySelector(\".panel\");\nconst card = document.querySelector(\".pcard\");\nlet timer=null;\nconst start=()=>{ if(panel.classList.contains(\"show\")) return;\n  card.classList.add(\"dwelling\"); card.classList.remove(\"fired\");\n  timer=setTimeout(()=>{ panel.classList.add(\"show\"); card.classList.add(\"fired\"); card.classList.remove(\"dwelling\"); },3000);\n};\nconst cancel=()=>{ clearTimeout(timer); if(!card.classList.contains(\"fired\")) card.classList.remove(\"dwelling\"); };\ncard.addEventListener(\"mouseenter\",start);\ncard.addEventListener(\"mouseleave\",cancel);\ndocument.querySelector(\".pop-close\").addEventListener(\"click\",()=>{ panel.classList.remove(\"show\"); card.classList.remove(\"fired\",\"dwelling\"); });\ndocument.querySelector(\".replay\").addEventListener(\"click\",()=>{ panel.classList.remove(\"show\"); card.classList.remove(\"fired\",\"dwelling\"); });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
