map $arg_p0v $p0_asset_cache_policy {
    default "no-cache, must-revalidate";
    "~^[a-f0-9]{16}$" "public, max-age=2592000, immutable";
}

server {
    server_name p0.leaibot.cn;

    root /opt/projects/lexiang/public/leaip0;
    index index.html;

    # Versioned frontend bundles and product media are immutable. The page HTML
    # remains revalidated so deployments become visible immediately.
    location ^~ /frontend/ {
        alias /opt/projects/lexiang/public/leaip0/assets/frontend/;
        add_header Cache-Control $p0_asset_cache_policy always;
        access_log off;
    }

    location ^~ /img/ {
        alias /opt/projects/lexiang/public/leaip0/assets/img/;
        add_header Cache-Control $p0_asset_cache_policy always;
        access_log off;
    }

    location ^~ /assets/ {
        add_header Cache-Control $p0_asset_cache_policy always;
        access_log off;
    }

    # Retired standalone pages open the current feature instead of an obsolete copy.
    location = /assets/pages/shop-chat-appointment-offline.html {
        return 302 /shop-chat/?p0entry=stores&$args;
    }
    location = /shop-chat/member-stage.html {
        return 302 /shop-chat/?p0entry=member&$args;
    }

    # Preserve old entry URLs while serving the current canonical pages.
    location = /index.html {
        if ($request_uri ~ "^/index[.]html([?]|$)") { return 302 /$is_args$args; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /shop-chat.html {
        if ($request_uri ~ "^/shop-chat[.]html([?]|$)") { return 302 /shop-chat/$is_args$args; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /b-chat.html {
        if ($request_uri ~ "^/b-chat[.]html([?]|$)") { return 302 /b-chat/$is_args$args; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /biz-chat.html {
        if ($request_uri ~ "^/biz-chat[.]html([?]|$)") { return 302 /biz-chat/$is_args$args; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /shop-chat/index.html {
        if ($request_uri ~ "^/shop-chat/index[.]html([?]|$)") { return 302 /shop-chat/$is_args$args; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /b-chat/index.html {
        if ($request_uri ~ "^/b-chat/index[.]html([?]|$)") { return 302 /b-chat/$is_args$args; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /biz-chat/index.html {
        if ($request_uri ~ "^/biz-chat/index[.]html([?]|$)") { return 302 /biz-chat/$is_args$args; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /brand/index.html {
        if ($request_uri ~ "^/brand/index[.]html([?]|$)") { return 302 /brand/$is_args$args; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # P0 independent backend. Buffer normal responses so slow clients do not
    # hold the Node worker; streaming endpoints can override buffering itself.
    # 内部诊断通道（流式模式），复现前端 SSE 卡死用，随时可删
    location /api-stream-test/ {
        proxy_pass http://127.0.0.1:3031/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # Retired full-storage diagnostic: reject legacy clients without saving bodies.
    location = /_lxdiag {
        return 410;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # SSE 流式必须关缓冲：开着会把流式回答攒到 16k 才吐，前端表现为"点半天没反应然后一次全出"
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/p0.leaibot.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p0.leaibot.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name p0.leaibot.cn;
    return 301 https://$host$request_uri;
}
