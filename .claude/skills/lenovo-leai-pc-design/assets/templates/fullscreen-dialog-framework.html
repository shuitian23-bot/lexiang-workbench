<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>联想乐享 · 全屏对话框架模板</title>
<style>
  /* ============ Tokens（严格继承规范） ============ */
  :root{
    --brand-red:#e42b20;
    --price-red:#ff2b2b;
    --aubergine:#5b1452;
    --aubergine-dark:#4e1646;
    --lavender-bg:rgba(247,243,250,.5);
    --lavender-weak:#f6f1f8;
    --lavender-hover:#f0eaf8;
    --grad-light:linear-gradient(96deg,#fcf2f8 22.83%,#e3eafd 98.41%);
    --grad-brand:linear-gradient(90deg,#4d144a 11.9%,#b8252e 100%);
    --grad-composer:linear-gradient(120deg,#a262d7 0%,#ff3c3c 65%,#4f1649 100%);
    --border:#e6dfea;
    --border-strong:#d8c8dd;
    --text:#101010;
    --text-strong:#050505;
    --text-soft:#5f5a64;
    --text-muted:#9a929f;
    --placeholder:#bcb4c1;
    --menu-text:#2d2931;
    /* 分层阴影体系 */
    --sh-1:0 1px 2px rgba(40,22,50,.05), 0 2px 8px rgba(40,22,50,.05);
    --sh-2:0 1px 2px rgba(40,22,50,.05), 0 8px 24px rgba(40,22,50,.10);
    --sh-3:0 2px 4px rgba(40,22,50,.06), 0 12px 32px rgba(40,22,50,.12), 0 28px 64px rgba(40,22,50,.10);
    --r-control:7px; --r-panel:8px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --ease-spring:cubic-bezier(.34,1.4,.4,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0}
  html{height:100%;scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow:hidden}
  body{
    height:100%;min-height:100vh;color:var(--text);
    font-family:"Source Han Sans CN","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    background-color:var(--lavender-bg);
    background-image:
      linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.28) 48%, rgba(255,255,255,.88) 66%, rgba(255,255,255,.98) 100%),
      radial-gradient(1100px 540px at 16% -10%, rgba(251,232,243,.45) 0%, rgba(251,232,243,0) 62%),
      radial-gradient(1000px 580px at 102% -4%, rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 58%),
      radial-gradient(900px 700px at 50% 118%, rgba(245,236,250,.4) 0%, rgba(245,236,250,0) 60%);
    background-attachment:fixed;
    overflow:hidden;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;padding:0}
  a{color:inherit}
  ::selection{background:#eed8ec;color:var(--aubergine-dark)}
  svg{display:block}
  :focus{outline:none}
  :focus-visible{outline:2px solid rgba(91,20,82,.55);outline-offset:2px;border-radius:8px}

  /* ============ 玻璃材质（含降级） ============ */
  .glass{
    background:rgba(255,255,255,.95); /* 不支持 backdrop-filter 的浏览器：实底 */
    border:1px solid rgba(255,255,255,.85);
    box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,.9);
  }
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass{
      background:rgba(255,255,255,.66);
      -webkit-backdrop-filter:blur(20px) saturate(1.5);
      backdrop-filter:blur(20px) saturate(1.5);
    }
  }

  /* ============ 入场编排 ============ */
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .anim-rise{opacity:0;animation:rise .64s var(--ease) forwards}
  .anim-fade{opacity:0;animation:fade .6s ease forwards}

  /* ============ 悬浮顶栏 ============ */
  .topbar{
    position:fixed;top:14px;left:18px;right:18px;z-index:60;
    display:flex;align-items:flex-start;justify-content:space-between;
    pointer-events:none;
  }
  .topbar>*{pointer-events:auto}

  .logo-pill{
    height:50px;display:flex;align-items:center;gap:11px;
    margin-left:4px;padding:0;border-radius:0;
  }
  .logo-full{width:auto;height:30px;flex:none;display:block}

  /* 中间：会话名 + 展开 */
  .nav-cluster{position:relative;display:flex;flex-direction:column;align-items:center}
  .convo-pill{
    width:88px;height:30px;display:flex;align-items:center;justify-content:center;
    padding:0;border-radius:0 0 16px 16px;color:#8b8990;
    transition:opacity .2s var(--ease),visibility 0s,transform .25s var(--ease),box-shadow .25s var(--ease),background-color .25s var(--ease);
    transform:translateY(-14px);
  }
  .nav-cluster.open .convo-pill{
    opacity:0;visibility:hidden;pointer-events:none;
    transform:translateY(-12px) scale(.86);
    transition:opacity .16s var(--ease),visibility 0s linear .16s,transform .22s var(--ease);
  }
  .convo-pill:hover{box-shadow:var(--sh-3),inset 0 1px 0 rgba(255,255,255,.9)}
  .convo-pill .dot,
  .convo-name{display:none}
  .expand-btn{
    width:26px;height:26px;flex:none;
    display:flex;align-items:center;justify-content:center;color:currentColor;
    opacity:1;transform:none;
    transition:transform .3s var(--ease-spring),color .2s var(--ease);
  }
  .convo-pill:hover .expand-btn,
  .nav-cluster.open .expand-btn{color:#6f6b72}
  .expand-btn svg{transition:transform .32s var(--ease)}
  .nav-cluster.open .expand-btn svg{transform:rotate(180deg)}

  .nav-sheet{
    position:absolute;top:0;left:50%;
    padding:8px;border-radius:18px;
    display:flex;gap:2px;white-space:nowrap;
    opacity:0;visibility:hidden;
    transform:translate(-50%,-14px) scale(.97);
    transform-origin:top center;
    transition:opacity .26s var(--ease),transform .3s var(--ease),visibility 0s linear .3s;
  }
  .nav-cluster.open .nav-sheet{
    opacity:1;visibility:visible;transform:translate(-50%,0) scale(1);
    transition:opacity .26s var(--ease),transform .3s var(--ease-spring),visibility 0s;
  }
  .nav-sheet a{
    position:relative;height:42px;display:flex;align-items:center;padding:0 19px;
    border-radius:12px;text-decoration:none;color:var(--text-soft);
    font-size:15px;font-weight:600;
    transition:color .16s,background-color .16s;
  }
  .nav-sheet a:hover{background:var(--lavender-hover);color:var(--aubergine)}
  .nav-sheet a.active{color:var(--aubergine)}
  .nav-sheet a.active::after{
    content:"";position:absolute;left:19px;right:19px;bottom:6px;height:2px;
    border-radius:2px;background:var(--grad-brand);
  }

  /* 右侧动作组 */
  .actions{height:50px;display:flex;align-items:center;gap:4px;padding:0 9px;border-radius:999px}
  .ic{
    width:38px;height:38px;border-radius:50%;position:relative;
    display:flex;align-items:center;justify-content:center;color:#3c3542;
    transition:background-color .16s,color .16s,transform .16s var(--ease);
  }
  .ic:hover{background:var(--lavender-hover);color:var(--aubergine)}
  .ic:active{transform:scale(.92)}
  .badge{
    position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;
    border-radius:999px;background:var(--brand-red);color:#fff;
    font-size:10px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(228,43,32,.3);
  }
  .divider{width:1px;height:22px;background:var(--border);margin:0 4px}
  .avatar{
    width:34px;height:34px;border-radius:50%;flex:none;
    background:var(--grad-brand);color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 6px rgba(77,20,74,.3);
    transition:transform .16s var(--ease);
  }
  .avatar:hover{transform:scale(1.06)}

  /* ============ 侧栏 ============ */
  .rail{
    position:fixed;top:78px;left:18px;bottom:18px;width:268px;z-index:50;
    border-radius:20px;padding:16px 14px;display:flex;flex-direction:column;
    transform:translate3d(calc(-100% - 26px),0,0);
    transition:transform .38s var(--ease);
    will-change:transform;
  }
  .rail.open{transform:translate3d(0,0,0)}
  .rail-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .new-chat{
    flex:1;height:46px;display:flex;align-items:center;justify-content:center;gap:9px;
    min-width:0;padding:0 16px;
    border-radius:14px;border:1px solid var(--border);
    background:rgba(255,255,255,.7);
    color:var(--aubergine);font-size:15px;font-weight:600;line-height:1;
    box-shadow:none;
    transition:background-color .18s,border-color .18s,box-shadow .18s,transform .18s var(--ease);
  }
  .new-chat:hover{background:var(--lavender-hover);border-color:var(--border-strong);box-shadow:var(--sh-1)}
  .new-chat:active{transform:scale(.985)}
  .rail-toggle{
    width:42px;height:42px;border:1px solid var(--border);border-radius:13px;flex:none;
    background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
    color:var(--aubergine);transition:background-color .16s,border-color .16s;
  }
  .rail-toggle:hover{background:var(--lavender-hover);border-color:var(--border-strong)}
  .rail h3{
    margin:18px 8px 8px;font-size:12px;font-weight:700;color:var(--text-muted);
    letter-spacing:.12em;
  }
  .hist{
    flex:1;overflow-y:auto;overflow-x:hidden;
    display:flex;flex-direction:column;gap:2px;
    margin:0 -6px;padding:0 6px 6px;
    scrollbar-width:thin;scrollbar-color:#dcd2e3 transparent;
  }
  .hist::-webkit-scrollbar{width:6px}
  .hist::-webkit-scrollbar-track{background:transparent}
  .hist::-webkit-scrollbar-thumb{background:#dcd2e3;border-radius:6px}
  .hist::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}
  .hist a{
    position:relative;height:38px;flex:none;display:flex;align-items:center;padding:0 12px;
    border-radius:10px;color:var(--menu-text);font-size:14px;text-decoration:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:38px;
    transition:background-color .15s,color .15s,padding-left .2s var(--ease);
  }
  .hist a:hover{background:#f0eaf8;color:#4e1646;padding-left:15px}
  .hist a.active{background:#f0eaf8;color:#4e1646;font-weight:600}
  .hist a.active::before{
    content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;
    background:var(--grad-brand);
  }
  .rail-foot{
    margin-top:10px;padding:11px 12px;border-radius:13px;
    background:var(--grad-light);
    font-size:12px;line-height:1.55;color:var(--text-soft);
  }
  .rail-foot strong{color:var(--aubergine);font-weight:700}

  .rail-fab,
  .rail-new-fab{
    position:fixed;left:22px;top:80px;z-index:45;
    width:44px;height:44px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;color:var(--aubergine);
    transition:opacity .22s,transform .3s var(--ease),visibility 0s;
  }
  .rail-new-fab{top:134px}
  .rail-fab.hide,
  .rail-new-fab.hide{opacity:0;visibility:hidden;transform:translateX(-10px);transition:opacity .18s,transform .18s,visibility 0s linear .2s}
  .rail-fab:hover,
  .rail-new-fab:hover{box-shadow:var(--sh-3),inset 0 1px 0 rgba(255,255,255,.9)}

  /* ============ 主舞台 ============ */
  .stage{
    min-height:100vh;height:100vh;display:flex;flex-direction:column;
    padding:96px 40px 20px;
    transition:padding-left .38s var(--ease);
    overflow:hidden;
  }
  .stage.shift{padding-left:316px}

  /* 欢迎态 */
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:7vh}
  .hello{
    font-size:40.5px;font-size:clamp(25.5px,3.3vw,43.5px);
    font-weight:700;letter-spacing:.02em;text-align:center;line-height:1.15;
    color:#17121c;
    background:linear-gradient(175deg,#1a141f 30%,#52294e 90%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    display:flex;align-items:center;justify-content:center;gap:.3em;flex-wrap:wrap;
    min-height:1.2em;
  }
  .hello span{
    background:linear-gradient(175deg,#1a141f 30%,#52294e 90%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .hello .rotating-word{
    display:inline-block;text-align:center;
    background:none;color:var(--aubergine-dark);-webkit-text-fill-color:var(--aubergine-dark);
    transition:opacity .34s var(--ease),transform .34s var(--ease),filter .34s var(--ease);
    will-change:opacity,transform,filter;
  }
  .hello .rotating-word.out{opacity:0;transform:translateY(-18px);filter:blur(5px)}
  .hello .rotating-word.in{opacity:0;transform:translateY(18px);filter:blur(5px)}
  @supports not (-webkit-background-clip:text){.hello{background:none;color:#1a141f}}
  .chips{
    display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
    gap:10px 12px;width:min(100%,700px);margin:36px auto 0;
  }
  .chip-q:nth-child(1){grid-column:1 / span 2}
  .chip-q:nth-child(2){grid-column:3 / span 2}
  .chip-q:nth-child(3){grid-column:5 / span 2}
  .chip-q:nth-child(4){grid-column:2 / span 2}
  .chip-q:nth-child(5){grid-column:4 / span 2}
  .chip-q{
    width:100%;min-height:60px;display:inline-flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 10px 12px 16px;border-radius:12px;
    border:1px solid rgba(255,255,255,.85);
    background:rgba(255,255,255,.78);
    color:#2c2730;font-size:12.5px;font-weight:500;text-align:left;line-height:1.45;
    box-shadow:0 1px 2px rgba(40,22,50,.05),0 4px 14px rgba(40,22,50,.07);
    transition:transform .22s var(--ease),box-shadow .22s var(--ease),background-color .2s,color .2s;
  }
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .chip-q{background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  }
  .chip-q:hover{transform:translateY(-3px);background:var(--grad-light);border-color:rgba(255,255,255,.9);box-shadow:var(--sh-2);color:var(--aubergine)}
  .chip-q:active{transform:translateY(-1px)}
  .chip-q .arrow{
    width:20px;height:20px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:rgba(91,20,82,.08);color:var(--aubergine);
    transition:background-color .2s,color .2s,transform .22s var(--ease);
  }
  .chip-q:hover .arrow{background:var(--aubergine);color:#fff;transform:translateX(3px)}

  /* 对话态 */
  .thread{
    flex:1;width:100%;max-width:820px;margin:0 auto;
    min-height:0;overflow-y:auto;overflow-x:hidden;
    display:none;flex-direction:column;gap:24px;padding-bottom:18px;
    scrollbar-width:none;
  }
  .thread::-webkit-scrollbar{display:none}
  .thread.show{display:flex}
  .msg-user{
    align-self:flex-end;max-width:70%;padding:13px 18px;
    border-radius:16px 16px 5px 16px;
    background:linear-gradient(90deg,#fff2f8 0%,#f0f1ff 100%);
    font-size:15px;line-height:1.6;color:#231d29;
    box-shadow:var(--sh-1);
    animation:rise .4s var(--ease);
  }
  .msg-ai{align-self:flex-start;max-width:100%;overflow-wrap:anywhere;animation:rise .45s var(--ease)}
  .ai-body{font-size:15.5px;line-height:1.76;color:#1d1822}
  .ai-body h4{
    margin:20px 0 8px;font-size:15px;color:var(--aubergine);font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .ai-body h4::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--grad-brand);flex:none}
  .ai-body ul{margin:6px 0;padding-left:21px}
  .ai-body li{margin:6px 0;color:#36313d}
  .ai-body li::marker{color:var(--border-strong)}
  .ai-body p{margin:10px 0}
  .followups{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .followups button{
    padding:9px 15px;border-radius:11px;border:1px solid var(--border);
    background:rgba(255,255,255,.8);color:var(--aubergine);
    font-size:13.5px;font-weight:500;
    transition:background-color .16s,border-color .16s,box-shadow .16s,transform .16s var(--ease);
  }
  .followups button:hover{background:var(--lavender-hover);border-color:var(--border-strong);box-shadow:var(--sh-1);transform:translateY(-1px)}
  .disclaimer{margin-top:15px;color:var(--text-muted);font-size:12px}
  .typing{display:inline-flex;gap:5px;align-items:center;color:var(--aubergine);font-size:13.5px;font-weight:600}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--brand-red);animation:bob 1.15s var(--ease) infinite}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes bob{0%,62%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}

  /* ============ 右侧对话索引 ============ */
  .turn-index{
    position:fixed;right:14px;top:50%;z-index:55;
    transform:translateY(-50%);
    width:214px;min-height:292px;
    display:none;align-items:center;justify-content:flex-end;
  }
  .turn-index.show{display:flex}
  .turn-dots{
    width:12px;min-height:42px;padding:7px 0;border-radius:999px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.82);
    box-shadow:var(--sh-1),inset 0 1px 0 rgba(255,255,255,.9);
  }
  .turn-dots i{
    width:4px;height:4px;border-radius:50%;
    background:#d8c8dd;
  }
  .turn-dots i.active{background:var(--aubergine)}
  .turn-panel{
    position:absolute;right:24px;top:50%;
    width:178px;max-height:270px;padding:10px;border-radius:10px;
    transform:translate(10px,-50%) scale(.98);
    opacity:0;visibility:hidden;pointer-events:none;
    overflow:hidden;text-align:left;
    transition:opacity .18s var(--ease),visibility 0s linear .18s,transform .22s var(--ease);
  }
  .turn-index:hover .turn-panel,
  .turn-index:focus-within .turn-panel{
    opacity:1;visibility:visible;pointer-events:auto;
    transform:translate(0,-50%) scale(1);
    transition:opacity .18s var(--ease),visibility 0s,transform .22s var(--ease);
  }
  .turn-panel h4{
    margin:0 0 8px;padding:0 4px;
    color:var(--text-soft);font-size:12px;font-weight:600;text-align:left;
  }
  .turn-list{display:flex;flex-direction:column;align-items:stretch;gap:4px;max-height:224px;overflow:auto;scrollbar-width:none}
  .turn-list::-webkit-scrollbar{display:none}
  .turn-list button{
    display:block;min-height:34px;width:100%;padding:8px 10px;border-radius:7px;
    color:var(--menu-text);font-size:12.5px;line-height:1.35;text-align:left;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background-color .16s,color .16s;
  }
  .turn-list button:hover,
  .turn-list button.active{background:#f0eaf8;color:#4e1646;font-weight:600}

  /* ============ 底部 dock ============ */
  .dock{position:-webkit-sticky;position:sticky;bottom:0;width:100%;max-width:820px;margin:0 auto;padding-top:8px;transform:translateY(16px)}
  .quick{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:9px;margin-bottom:14px}
  .quick button{
    display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 18px;border-radius:11px;
    border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.72);
    color:#3a3340;font-size:13px;font-weight:500;
    transition:background-color .16s,color .16s,box-shadow .18s,transform .18s var(--ease);
  }
  .quick button:hover{background:#fff;color:var(--aubergine);box-shadow:var(--sh-1);transform:translateY(-1px)}

  .composer{
    position:relative;border-radius:20px;padding:16px 16px 12px;
    background:
      linear-gradient(#fff,#fff) padding-box,
      var(--grad-composer) border-box;
    border:1px solid transparent;
    box-shadow:var(--sh-3);
    transition:box-shadow .25s var(--ease);
  }
  .composer:focus-within{box-shadow:var(--sh-3),0 0 0 5px rgba(162,98,215,.10)}
  .composer textarea{
    width:100%;min-height:30px;max-height:148px;
    padding:0;border:0;outline:0;resize:none;background:transparent;box-shadow:none;
    color:var(--text);font-size:16px;line-height:1.55;
    overflow-y:auto;scrollbar-width:thin;
  }
  .composer textarea:focus,
  .composer textarea:focus-visible{outline:0;box-shadow:none}
  .composer textarea::placeholder{color:var(--placeholder)}
  .comp-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:10px}
  .comp-left{display:flex;align-items:center;gap:10px}
  .toggle{
    display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:var(--r-control);
    border:1px solid var(--border);background:#fff;color:var(--aubergine);
    font-size:14px;font-weight:400;line-height:1;white-space:nowrap;box-shadow:none;
    transition:background-color .16s,border-color .16s;
  }
  .toggle:hover,
  .toggle.on{background:var(--lavender-hover)}
  .toggle svg,
  .toggle img{width:1em;height:1em;flex:none;display:block}
  .comp-right{display:flex;align-items:center;gap:10px}
  .img-btn{
    width:38px;height:38px;flex:0 0 38px;border:1px solid var(--border);border-radius:11px;background:#fff;
    display:flex;align-items:center;justify-content:center;color:#5a525f;
    box-shadow:none;
    transition:background-color .16s,color .16s,border-color .16s;
  }
  .img-btn:hover{background:var(--lavender-hover);color:var(--aubergine);border-color:var(--border-strong)}
  .send{
    width:40px;height:40px;flex:0 0 40px;border-radius:50%;
    background:var(--grad-brand);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(180,37,46,.35),inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .2s var(--ease-spring),box-shadow .2s,opacity .2s;
  }
  .send:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 9px 22px rgba(180,37,46,.42),inset 0 1px 0 rgba(255,255,255,.28)}
  .send:active{transform:translateY(0) scale(.96)}
  .send.idle{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}

  .footnote{margin-top:10px;text-align:center;font-size:11.5px;color:var(--text-muted)}

  .scrim{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;
    background:rgba(28,18,34,.18);
    opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s linear .3s;
  }
  .scrim.show{opacity:1;visibility:visible;transition:opacity .3s,visibility 0s}

  @media (max-width:1100px){
    .stage.shift{padding-left:40px}
    .chips{grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,520px)}
    .chip-q:nth-child(n){grid-column:auto}
  }
  @media (max-width:720px){
    .chips{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    .anim-rise,.anim-fade{opacity:1}
    .hello .rotating-word{transition:none}
  }
</style>
</head>
<body>

<!-- 悬浮顶栏 -->
<header class="topbar">
  <div class="logo-pill anim-fade" style="animation-delay:.05s" aria-label="联想乐享">
    <img class="logo-full" src="../logos/logo-full-red.png" alt="联想乐享" />
  </div>

  <nav class="nav-cluster anim-fade" id="navCluster" style="animation-delay:.12s">
    <button class="convo-pill glass" id="convoPill" aria-label="展开导航" aria-expanded="false" aria-controls="navSheet" aria-haspopup="true">
      <span class="dot" aria-hidden="true"></span>
      <span class="convo-name" id="convoName" title="新对话">新对话</span>
      <span class="expand-btn" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5.5 8.5 12 15l6.5-6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
    <div class="nav-sheet glass" id="navSheet" role="menu">
      <a href="#" role="menuitem">首页</a>
      <a href="#" role="menuitem">个人及家庭</a>
      <a href="#" role="menuitem">中小企业</a>
      <a href="#" role="menuitem">政教及大企业</a>
      <a href="#" role="menuitem">品牌</a>
    </div>
  </nav>

  <div class="actions glass anim-fade" style="animation-delay:.19s">
    <button class="ic" aria-label="收起">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M14.5 8.5 11 12l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 4.5v15" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="ic" aria-label="购物车，2 件商品">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.3a1 1 0 0 0 1 .8h8.5a1 1 0 0 0 1-.8L21 8H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.2" cy="20" r="1.45" fill="currentColor"/><circle cx="17.8" cy="20" r="1.45" fill="currentColor"/></svg>
      <span class="badge">2</span>
    </button>
    <button class="ic" aria-label="消息，2 条未读">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span class="badge">2</span>
    </button>
    <span class="divider" aria-hidden="true"></span>
    <button class="avatar" aria-label="个人中心">乐</button>
  </div>
</header>

<!-- 侧栏开关（收起态） -->
<button class="rail-fab glass hide" id="railFab" aria-label="展开侧栏">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.8"/></svg>
</button>
<button class="rail-new-fab glass hide" id="railNewFab" aria-label="新建对话">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
</button>

<!-- 侧栏 -->
<aside class="rail glass open" id="rail" aria-label="对话与历史">
  <div class="rail-head">
    <button class="new-chat" id="newChat">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
      新建对话
    </button>
    <button class="rail-toggle" id="railClose" aria-label="收起侧栏">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
  </div>
  <h3>历史记录</h3>
  <nav class="hist" id="hist">
    <a href="#" title="帮我推荐一款商品">帮我推荐一款商品</a>
    <a href="#" title="帮我推荐一款商品帮我推荐一款商品">帮我推荐一款商品帮我推荐一款商品</a>
    <a href="#" title="帮我推荐一款商品">帮我推荐一款商品</a>
    <a href="#" title="你家笔记本最好的新款给推荐一款">你家笔记本最好的新款给推荐一款…</a>
  </nav>
  <div class="rail-foot"><strong>乐豆商城</strong> · 积分可抵现，会员日翻倍，详情见会员中心。</div>
</aside>

<div class="scrim" id="scrim"></div>
<aside class="turn-index" id="turnIndex" aria-label="对话轮次索引">
  <div class="turn-dots" id="turnDots" aria-hidden="true"></div>
  <div class="turn-panel glass">
    <h4>对话问题</h4>
    <div class="turn-list" id="turnList"></div>
  </div>
</aside>

<!-- 主舞台 -->
<main class="stage shift" id="stage">
  <section class="welcome" id="welcome">
    <h1 class="hello anim-rise" id="helloTitle" style="animation-delay:.1s">你好，我是联想乐享</h1>
    <div class="chips" id="chips"></div>
  </section>

  <section class="thread" id="thread" aria-live="polite"></section>

  <div class="dock anim-rise" style="animation-delay:.34s">
    <div class="quick" id="quick"></div>
    <form class="composer" id="composer">
      <textarea id="ta" rows="1" placeholder="最近有什么优惠活动？" aria-label="输入你的问题"></textarea>
      <div class="comp-actions">
        <div class="comp-left">
          <button type="button" class="toggle on" aria-pressed="true">
            <img src="../icons/composer-deep-think.svg" alt="" />
            深度思考
          </button>
          <button type="button" class="toggle" aria-pressed="false">
            <img src="../icons/composer-web-search.svg" alt="" />
            联网搜索
          </button>
        </div>
        <div class="comp-right">
          <button type="button" class="img-btn" aria-label="添加图片">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10" r="1.6" stroke="currentColor" stroke-width="1.5"/><path d="m5.5 17 4-3.6 3 2.5 3.5-3.4 2.5 2.8" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
          <button type="submit" class="send idle" id="send" aria-label="发送">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 19V6M6 11.2 12 5.2l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </form>
    <p class="footnote">内容由联想乐享基于当前信息生成，请在使用前核对关键信息。</p>
  </div>
</main>

<script>
(function(){
  "use strict";
  var $=function(s){return document.querySelector(s)};

  /* ---- 欢迎标题轮播 ---- */
  var helloTitle=$('#helloTitle');
  var helloWords=['找商品','找门店','找服务','职场认证','教育优惠','找解决方案'];
  var helloIndex=0;
  var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setRotatingTitle(word){
    helloTitle.innerHTML='<span>联想乐享帮你</span><span class="rotating-word">'+word+'</span>';
  }
  function rotateTitleWord(){
    if(!helloTitle||welcome.style.display==='none')return;
    var word=helloTitle.querySelector('.rotating-word');
    if(!word){setRotatingTitle(helloWords[helloIndex]);return}
    word.classList.add('out');
    window.setTimeout(function(){
      helloIndex=(helloIndex+1)%helloWords.length;
      word.textContent=helloWords[helloIndex];
      word.classList.remove('out');
      word.classList.add('in');
      window.requestAnimationFrame(function(){word.classList.remove('in')});
    },reduceMotion?0:340);
  }
  window.setTimeout(function(){
    if(!helloTitle)return;
    setRotatingTitle(helloWords[helloIndex]);
    if(!reduceMotion)window.setInterval(rotateTitleWord,2000);
  },reduceMotion?0:2000);

  /* ---- 顶部导航：默认收起，hover/点击展开 ---- */
  var cluster=$('#navCluster'),pill=$('#convoPill'),hoverTimer=null;
  function setNav(open){
    cluster.classList.toggle('open',open);
    pill.setAttribute('aria-expanded',open?'true':'false');
  }
  pill.addEventListener('click',function(){setNav(!cluster.classList.contains('open'))});
  cluster.addEventListener('mouseenter',function(){clearTimeout(hoverTimer);setNav(true)});
  cluster.addEventListener('mouseleave',function(){hoverTimer=setTimeout(function(){setNav(false)},260)});
  Array.prototype.forEach.call(document.querySelectorAll('#navSheet a'),function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      Array.prototype.forEach.call(document.querySelectorAll('#navSheet a'),function(x){x.classList.remove('active')});
      a.classList.add('active');setNav(false);
    });
  });
  document.addEventListener('click',function(e){if(!cluster.contains(e.target))setNav(false)});

  /* ---- 侧栏 ---- */
  var rail=$('#rail'),fab=$('#railFab'),newFab=$('#railNewFab'),scrim=$('#scrim'),stage=$('#stage');
  function wide(){return window.innerWidth>=1280}
  function openRail(o){
    rail.classList.toggle('open',o);
    fab.classList.toggle('hide',o);
    newFab.classList.toggle('hide',o);
    stage.classList.toggle('shift',o&&wide());
    scrim.classList.remove('show');
  }
  fab.addEventListener('click',function(){openRail(true)});
  $('#railClose').addEventListener('click',function(){openRail(false)});
  scrim.addEventListener('click',function(){openRail(false)});
  window.addEventListener('resize',function(){openRail(wide())});
  openRail(wide());

  /* ---- 历史记录选中 ---- */
  $('#hist').addEventListener('click',function(e){
    var a=e.target.closest('a');if(!a)return;e.preventDefault();
    Array.prototype.forEach.call(document.querySelectorAll('#hist a'),function(x){x.classList.remove('active')});
    a.classList.add('active');
  });

  /* ---- composer ---- */
  Array.prototype.forEach.call(document.querySelectorAll('.toggle'),function(b){
    b.addEventListener('click',function(){
      var on=b.classList.toggle('on');b.setAttribute('aria-pressed',on?'true':'false');
    });
  });
  var ta=$('#ta'),send=$('#send');
  function fit(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,148)+'px'}
  function syncSend(){send.classList.toggle('idle',!ta.value.trim())}
  ta.addEventListener('input',function(){fit();syncSend()});
  ta.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();trySubmit()}
  });

  /* ---- 数据 ---- */
  var QS=['想买游戏本，预算8000怎么选？','学生买轻薄本，国补和教育优惠能省多少？','小新和YOGA系列怎么选？','旧电脑换新能抵多少钱？','哪里有卖ThinkPad笔记本电脑门店'];
  var ARROW='<span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13.5 6.5 19 12l-5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  var chips=$('#chips');
  chips.innerHTML=QS.map(function(q,i){
    return '<button class="chip-q anim-rise" style="animation-delay:'+(0.3+i*0.07)+'s" data-q="'+q+'">'+q+ARROW+'</button>';
  }).join('');

  var QUICKS=['教育特惠','以旧换新','乐豆商城','0元试用','私人订制','会员中心','拉新返利'];
  $('#quick').innerHTML=QUICKS.map(function(q){
    return '<button type="button">'+q+'</button>';
  }).join('');
  $('#quick').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    ta.value='';fit();syncSend();
    submit(b.textContent.trim());
  });

  /* ---- 对话流程 ---- */
  var welcome=$('#welcome'),thread=$('#thread'),convoName=$('#convoName');
  var turnIndex=$('#turnIndex'),turnDots=$('#turnDots'),turnList=$('#turnList'),turns=[];
  function shortText(text,max){
    return text.length>max?text.slice(0,max)+'…':text;
  }
  function escapeHtml(text){
    return text.replace(/[&<>"']/g,function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  function renderTurnIndex(activeId){
    turnIndex.classList.toggle('show',turns.length>0);
    turnDots.innerHTML=turns.map(function(t){
      return '<i class="'+(t.id===activeId?'active':'')+'"></i>';
    }).join('');
    turnList.innerHTML=turns.map(function(t,i){
      return '<button type="button" class="'+(t.id===activeId?'active':'')+'" data-target="'+t.id+'" title="'+escapeHtml(t.text)+'">'+escapeHtml(shortText(t.text,18))+'</button>';
    }).join('');
  }
  turnList.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var target=document.getElementById(b.getAttribute('data-target'));
    if(!target)return;
    renderTurnIndex(target.id);
    target.scrollIntoView({behavior:'smooth',block:'center'});
  });
  var ANSWER='<p>我是联想官方AI助手，主要可以帮您完成以下事情：</p>'
    +'<h4>产品选购</h4><ul><li>根据您的预算、用途和偏好推荐最适合的联想产品（笔记本、台式机、平板、手机、配件等）</li><li>帮您进行产品参数对比、性价比分析</li></ul>'
    +'<h4>优惠查询</h4><ul><li>提供最新优惠政策：国补、教育优惠、企业补贴、学生价等</li><li>帮您计算到手价、叠加各种优惠</li><li>推荐最适合您身份的优惠券</li></ul>'
    +'<h4>服务支持</h4><ul><li>查询保修状态、推荐延保方案</li><li>指导售后流程：退换货、维修、清洁保养、以旧换新估价</li><li>提供服务站地址和技术支持联系方式</li></ul>'
    +'<h4>订单辅助</h4><ul><li>协助处理订单、发货物流、发票等问题</li><li>指导会员权益、乐豆积分的使用</li></ul>'
    +'<p>有什么具体需求，随时可以和我说~</p>'
    +'<div class="followups"><button type="button">可以推荐适合学生的笔记本吗？</button><button type="button">怎么查询我的产品保修状态？</button><button type="button">现在有哪些可以叠加的优惠政策？</button></div>'
    +'<p class="disclaimer">内容由联想乐享基于当前信息生成，请在使用前核对关键信息。</p>';

  chips.addEventListener('click',function(e){
    var b=e.target.closest('.chip-q');if(b)submit(b.getAttribute('data-q'));
  });
  $('#composer').addEventListener('submit',function(e){e.preventDefault();trySubmit()});
  function trySubmit(){var v=ta.value.trim();if(v)submit(v)}
  function startNewConversation(collapseRail){
    thread.innerHTML='';thread.classList.remove('show');
    turns=[];renderTurnIndex('');
    welcome.style.display='flex';
    convoName.textContent='新对话';convoName.title='新对话';
    ta.value='';fit();syncSend();
    if(collapseRail&&!wide())openRail(false);
    ta.focus();
  }
  $('#newChat').addEventListener('click',function(){startNewConversation(true)});
  newFab.addEventListener('click',function(){startNewConversation(false)});

  function submit(text){
    welcome.style.display='none';thread.classList.add('show');
    convoName.textContent=shortText(text,15);
    convoName.title=text;
    var turnId='turn-'+Date.now()+'-'+turns.length;
    var u=document.createElement('div');u.className='msg-user';u.id=turnId;u.textContent=text;thread.appendChild(u);
    turns.push({id:turnId,text:text});renderTurnIndex(turnId);
    ta.value='';fit();syncSend();
    var ai=document.createElement('div');ai.className='msg-ai';
    ai.innerHTML='<div class="ai-body"><span class="typing"><i></i><i></i><i></i>&nbsp;检索知识库…</span></div>';
    thread.appendChild(ai);
    ai.scrollIntoView({behavior:'smooth',block:'end'});
    setTimeout(function(){
      ai.querySelector('.ai-body').innerHTML=ANSWER;
      ai.scrollIntoView({behavior:'smooth',block:'end'});
      Array.prototype.forEach.call(ai.querySelectorAll('.followups button'),function(b){
        b.addEventListener('click',function(){submit(b.textContent)});
      });
    },1100);
  }

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){setNav(false);if(!wide())openRail(false)}
  });
})();
</script>
</body>
</html>
