<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">多擎云桌面解决方案核心架构</title>
  <desc id="desc">从终端接入、四类桌面引擎、统一管理平台到基础设施的云桌面能力架构图</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fcfaff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#4d144a"/>
      <stop offset="0.52" stop-color="#841d3c"/>
      <stop offset="1" stop-color="#b2242f"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" x2="1">
      <stop offset="0" stop-color="#5668dc"/>
      <stop offset="1" stop-color="#8650bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#4d144a" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Source Han Sans CN", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { fill:#4d144a; font-size:22px; font-weight:600; }
      .body { fill:#454545; font-size:24px; font-weight:400; }
      .muted { fill:#606060; font-size:20px; font-weight:400; }
      .pill { fill:#4d144a; font-size:20px; font-weight:600; }
    </style>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <rect x="52" y="44" width="1496" height="672" rx="24" fill="#fff" stroke="#e2ddeb" stroke-width="2" filter="url(#shadow)"/>

  <g transform="translate(510 78)">
    <rect width="580" height="92" rx="18" fill="url(#cloud)"/>
    <text x="290" y="57" text-anchor="middle" fill="#fff" font-size="30" font-weight="600">多擎云桌面统一能力底座</text>
  </g>

  <path d="M800 170V205M235 205H1365M235 205V235M610 205V235M990 205V235M1365 205V235" fill="none" stroke="#c9c2dc" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(92 235)">
    <rect width="286" height="190" rx="18" fill="#fcfaff" stroke="#d8d0e3" stroke-width="2"/>
    <rect x="24" y="24" width="56" height="34" rx="9" fill="#f3edf6"/>
    <text class="pill" x="52" y="48" text-anchor="middle">01</text>
    <text class="label" x="24" y="94">终端接入</text>
    <text class="body" x="24" y="136">教学一体机 / 师生 PC</text>
    <text class="muted" x="24" y="174">统一纳管，多场景接入</text>
  </g>
  <g transform="translate(472 235)">
    <rect width="286" height="190" rx="18" fill="#fcfaff" stroke="#d8d0e3" stroke-width="2"/>
    <rect x="24" y="24" width="56" height="34" rx="9" fill="#f3edf6"/>
    <text class="pill" x="52" y="48" text-anchor="middle">02</text>
    <text class="label" x="24" y="94">多擎桌面引擎</text>
    <text class="body" x="24" y="136">VDI · VOI · IDV · TCI</text>
    <text class="muted" x="24" y="174">按需组合，灵活交付</text>
  </g>
  <g transform="translate(852 235)">
    <rect width="286" height="190" rx="18" fill="#fcfaff" stroke="#d8d0e3" stroke-width="2"/>
    <rect x="24" y="24" width="56" height="34" rx="9" fill="#f3edf6"/>
    <text class="pill" x="52" y="48" text-anchor="middle">03</text>
    <text class="label" x="24" y="94">教学资源平台</text>
    <text class="body" x="24" y="136">云资源与本地缓存</text>
    <text class="muted" x="24" y="174">教学资源高效分发</text>
  </g>
  <g transform="translate(1232 235)">
    <rect width="286" height="190" rx="18" fill="#fcfaff" stroke="#d8d0e3" stroke-width="2"/>
    <rect x="24" y="24" width="56" height="34" rx="9" fill="#f3edf6"/>
    <text class="pill" x="52" y="48" text-anchor="middle">04</text>
    <text class="label" x="24" y="94">统一资产运维</text>
    <text class="body" x="24" y="136">设备管理与远程运维</text>
    <text class="muted" x="24" y="174">安全可控，持续服务</text>
  </g>

  <path d="M235 425V474M610 425V474M990 425V474M1365 425V474M235 474H1365" fill="none" stroke="#c9c2dc" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(92 505)">
    <rect width="1426" height="154" rx="18" fill="#fff" stroke="#d8d0e3" stroke-width="2"/>
    <text class="label" x="34" y="54">统一基础设施与安全保障</text>
    <g transform="translate(34 82)">
      <rect width="250" height="46" rx="12" fill="#f3edf6"/>
      <text class="body" x="125" y="31" text-anchor="middle">计算与存储资源</text>
      <rect x="278" width="250" height="46" rx="12" fill="#f3edf6"/>
      <text class="body" x="403" y="31" text-anchor="middle">网络与数据安全</text>
      <rect x="556" width="250" height="46" rx="12" fill="#f3edf6"/>
      <text class="body" x="681" y="31" text-anchor="middle">开天系列 + 国产 OS</text>
      <rect x="834" width="250" height="46" rx="12" fill="#f3edf6"/>
      <text class="body" x="959" y="31" text-anchor="middle">权限与策略管理</text>
      <rect x="1112" width="250" height="46" rx="12" fill="#f3edf6"/>
      <text class="body" x="1237" y="31" text-anchor="middle">全国持续服务</text>
    </g>
  </g>
</svg>
