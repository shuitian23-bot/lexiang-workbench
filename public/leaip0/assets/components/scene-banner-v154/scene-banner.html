<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沉浸竞技 Banner</title>
  <style>
    :root{
      --bg:#f7f7fb;
      --panel:#ffffff;
      --panel-2:rgba(255,255,255,.82);
      --stroke:#ececf4;
      --text:#101014;
      --sub:#7d8091;
      --purple:#7a55ff;
      --purple-2:#a87dff;
      --shadow:0 18px 40px rgba(31,35,58,.08), 0 2px 10px rgba(31,35,58,.05);
      --radius:28px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(180deg,#fafafe 0%, #f4f5fb 100%);
      font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:22px;
    }

    .page{
      width:min(1880px,calc(100vw - 44px));
    }

    .banner{
      background:var(--panel);
      border:1px solid rgba(128,123,165,.16);
      border-radius:30px;
      overflow:hidden;
      box-shadow:none;
      position:relative;
    }

    .banner::before{
      content:"";
      position:absolute;
      inset:-20% auto auto -10%;
      width:480px;
      height:480px;
      background:radial-gradient(circle at center, rgba(132,104,255,.14) 0%, rgba(132,104,255,0) 68%);
      pointer-events:none;
      filter:blur(4px);
    }

    .hero{
      position:relative;
      display:grid;
      grid-template-columns: 1.05fr 1.15fr;
      gap:8px;
      min-height:470px;
      padding:34px 34px 0;
      background:linear-gradient(180deg,#ffffff 0%, #fbfbff 100%);
    }

    .left{
      position:relative;
      z-index:2;
      padding:18px 8px 28px 12px;
      max-width:700px;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 20px;
      border-radius:16px;
      color:#8f67ff;
      background:linear-gradient(135deg,rgba(173,140,255,.14),rgba(122,85,255,.06));
      border:1px solid rgba(160,129,255,.18);
      font-size:16px;
      font-weight:600;
      backdrop-filter: blur(10px);
      box-shadow:0 6px 18px rgba(122,85,255,.08);
    }

    .sparkle{
      width:14px;
      height:14px;
      position:relative;
      display:inline-block;
    }
    .sparkle::before,.sparkle::after{
      content:"";
      position:absolute;
      inset:0;
      margin:auto;
      background:#9b72ff;
      border-radius:2px;
    }
    .sparkle::before{width:14px;height:2px}
    .sparkle::after{width:2px;height:14px}

    .title{
      margin:34px 0 22px;
      font-size:78px;
      line-height:1.03;
      letter-spacing:-2px;
      font-weight:800;
      color:#0e0f18;
    }
    .title .accent{
      background:var(--lx-gradient-brand);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .desc{
      font-size:22px;
      line-height:1.75;
      color:#8b8ea0;
      margin-bottom:30px;
      max-width:650px;
    }

    .price{
      display:flex;
      align-items:flex-end;
      gap:10px;
      margin-bottom:28px;
      font-weight:800;
      color:#0f1118;
    }
    .price .currency{font-size:32px;line-height:1.15; padding-bottom:8px;}
    .price .num{font-size:64px;line-height:1; letter-spacing:-1px;}
    .price .suffix{font-size:28px;line-height:1.2; padding-bottom:8px;}

    .cta{
      display:inline-flex;
      align-items:center;
      gap:16px;
      padding:18px 38px;
      font-size:20px;
      font-weight:700;
      color:#fff;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,#b96dff 0%, #7d6dff 46%, #6773ff 100%);
      box-shadow:0 12px 28px rgba(111,110,255,.28);
      cursor:pointer;
      transition:transform .22s ease, box-shadow .22s ease;
    }
    .cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(111,110,255,.34)}
    .cta .arrow{font-size:24px;opacity:.92}

    .right{
      position:relative;
      min-height:470px;
      overflow:hidden;
      border-radius:26px;
    }

    .right::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 72% 30%, rgba(133,104,255,.18), transparent 30%),
        radial-gradient(circle at 90% 8%, rgba(215,191,255,.36), transparent 22%),
        linear-gradient(180deg, rgba(255,255,255,.65), rgba(247,247,251,.82));
      z-index:0;
    }

    .shelf-light, .shelf-light::before, .shelf-light::after{
      position:absolute;
      border-radius:999px;
      background:linear-gradient(90deg,rgba(122,85,255,.22),rgba(177,196,255,.38));
      filter:blur(.2px);
    }
    .shelf-light{top:52px; right:118px; width:256px;height:8px;opacity:.65}
    .shelf-light::before{content:""; top:26px; right:-36px; width:192px; height:6px; opacity:.66}
    .shelf-light::after{content:""; top:56px; right:36px; width:170px; height:5px; opacity:.36}

    .shelves{
      position:absolute;
      left:130px;
      top:24px;
      width:240px;
      height:218px;
      border-radius:26px;
      background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(245,245,252,.6));
      border:1px solid rgba(140,142,175,.1);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
      backdrop-filter:blur(8px);
      z-index:0;
    }
    .shelves::before, .shelves::after{
      content:"";
      position:absolute;
      left:0; right:0; margin:auto;
      height:2px;
      background:linear-gradient(90deg,rgba(122,85,255,.05),rgba(122,85,255,.3),rgba(122,85,255,.05));
    }
    .shelves::before{top:70px}
    .shelves::after{top:144px}

    .figurines{
      position:absolute;
      inset:10px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      grid-template-rows:repeat(3,1fr);
      gap:16px 12px;
      z-index:1;
      opacity:.78;
    }
    .figurines span{
      width:22px;
      height:34px;
      align-self:end;
      justify-self:center;
      border-radius:12px 12px 6px 6px;
      background:linear-gradient(180deg,rgba(95,88,140,.24),rgba(124,113,200,.18));
      box-shadow:0 0 14px rgba(138,129,255,.14);
      position:relative;
    }
    .figurines span::before{
      content:"";
      position:absolute;
      width:12px;height:12px;border-radius:50%;
      background:rgba(136,127,193,.24);
      left:50%;transform:translateX(-50%);
      top:-8px;
    }

    .desk{
      position:absolute;
      left:0; right:0; bottom:30px;
      height:145px;
      background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(237,238,247,.58));
      border-radius:36px 36px 0 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
      z-index:1;
    }

    .tooltip{
      position:absolute;
      top:34px;
      right:30px;
      z-index:5;
      padding:24px 28px;
      border-radius:22px;
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(14px);
      border:1px solid rgba(151,154,180,.18);
      box-shadow:0 18px 28px rgba(30,30,60,.08);
      min-width:340px;
    }
    .tooltip .tool-title{font-size:22px;font-weight:800;color:#15161c;margin-bottom:12px}
    .tooltip .tool-sub{font-size:18px;color:#5d6072;letter-spacing:.2px}

    .laptop{
      position:absolute;
      right:255px;
      top:110px;
      width:420px;
      height:255px;
      z-index:4;
      transform:skewX(-6deg) rotate(-2deg);
      animation:float 5s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{transform:skewX(-6deg) rotate(-2deg) translateY(0)}
      50%{transform:skewX(-6deg) rotate(-2deg) translateY(-5px)}
    }
    .laptop .screen{
      position:absolute;
      inset:0;
      border-radius:18px 18px 8px 8px;
      background:#11131a;
      border:8px solid #1f2430;
      box-shadow:0 16px 30px rgba(18,18,28,.2);
      overflow:hidden;
    }
    .laptop .screen::before{
      content:"";
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at 55% 42%, rgba(255,197,155,.8), rgba(255,197,155,0) 16%),
      radial-gradient(circle at 52% 45%, rgba(255,255,255,.95), rgba(255,255,255,0) 17%),
      radial-gradient(circle at 62% 32%, rgba(244,140,74,.55), rgba(244,140,74,0) 13%),
      radial-gradient(circle at 42% 30%, rgba(255,255,255,.8), rgba(255,255,255,0) 12%),
      radial-gradient(circle at 40% 55%, rgba(255,255,255,.6), rgba(255,255,255,0) 16%),
      radial-gradient(circle at 65% 65%, rgba(255,140,86,.25), rgba(255,140,86,0) 18%),
      radial-gradient(circle at 85% 15%, rgba(255,255,255,.22), rgba(255,255,255,0) 4%),
      linear-gradient(135deg,#0b0d14 0%,#131626 48%,#0a0b12 100%);
      filter:saturate(1.2);
    }
    .laptop .screen::after{
      content:"LEGION";
      position:absolute;
      left:54px;
      bottom:38px;
      font-size:52px;
      font-weight:800;
      letter-spacing:2px;
      color:#fff;
      text-shadow:0 6px 18px rgba(0,0,0,.28);
    }
    .hinge{
      position:absolute;
      left:18px; right:18px; bottom:-18px;
      height:28px;
      background:linear-gradient(180deg,#6e7282,#4f5465);
      clip-path:polygon(3% 0, 97% 0, 100% 100%, 0 100%);
      border-radius:0 0 14px 14px;
      box-shadow:0 12px 18px rgba(46,52,77,.18);
    }
    .keyboard-base{
      position:absolute;
      left:20px; right:20px; bottom:-55px;
      height:56px;
      background:linear-gradient(180deg,#a0a5b5,#7f8597);
      border-radius:0 0 18px 18px;
      box-shadow:0 16px 24px rgba(46,52,77,.18);
    }
    .logo-y{
      position:absolute;
      left:50%; top:45%;
      width:12px; height:12px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      box-shadow:0 0 0 8px rgba(122,85,255,.15);
      background:#7d66ff;
      z-index:6;
    }

    .keyboard{
      position:absolute;
      left:115px;
      bottom:78px;
      width:370px;
      height:58px;
      border-radius:12px;
      transform:skewX(-26deg) rotate(-2deg);
      background:linear-gradient(180deg,#383d4f 0%, #222736 100%);
      box-shadow:0 18px 30px rgba(32,34,46,.15);
      z-index:4;
      overflow:hidden;
    }
    .keyboard::before{
      content:"";
      position:absolute;
      inset:8px 12px;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.16) 0 12px, transparent 12px 16px),
        repeating-linear-gradient(180deg, rgba(255,255,255,.14) 0 9px, transparent 9px 13px);
      border-radius:8px;
      opacity:.34;
    }
    .keyboard::after{
      content:"";
      position:absolute;
      left:18px; right:18px; bottom:0;
      height:4px;
      background:linear-gradient(90deg,#7f63ff 0%, #c58eff 28%, #8aa7ff 66%, #ffbcb0 100%);
      border-radius:10px;
      box-shadow:0 0 14px rgba(122,85,255,.5);
    }

    .mouse{
      position:absolute;
      left:500px;
      bottom:60px;
      width:74px;
      height:96px;
      border-radius:44px 44px 36px 36px;
      background:linear-gradient(180deg,#575e72 0%, #262b39 70%, #202532 100%);
      transform:rotate(-8deg);
      box-shadow:0 14px 24px rgba(28,31,44,.14);
      z-index:4;
    }
    .mouse::before{
      content:"";
      position:absolute;
      top:18px; left:50%; transform:translateX(-50%);
      width:4px; height:18px; border-radius:8px;
      background:#dbe1ff;
      opacity:.78;
    }
    .mouse::after{
      content:"";
      position:absolute;
      bottom:18px; left:50%; transform:translateX(-50%) rotate(45deg);
      width:16px; height:16px;
      border-right:2px solid #9b86ff;
      border-bottom:2px solid #9b86ff;
      box-shadow:0 0 10px rgba(122,85,255,.24);
    }

    .headset{
      position:absolute;
      right:46px;
      top:150px;
      width:184px;
      height:250px;
      z-index:4;
    }
    .headset .stand{
      position:absolute;
      left:78px; top:28px;
      width:28px; height:154px;
      border-radius:14px;
      background:linear-gradient(180deg,#404656,#2a2f3d 100%);
      box-shadow:0 8px 16px rgba(40,44,60,.14);
    }
    .headset .stand::after{
      content:"";
      position:absolute;
      left:-52px; bottom:-18px;
      width:132px; height:14px;
      border-radius:999px;
      background:linear-gradient(180deg,#2f3442,#1f2431);
    }
    .headband{
      position:absolute;
      left:18px; top:0;
      width:144px; height:154px;
      border:14px solid #2d3240;
      border-bottom:0;
      border-radius:100px 100px 0 0;
      transform:rotate(-1deg);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.04);
    }
    .ear{
      position:absolute;
      width:76px; height:108px;
      border-radius:38px;
      background:linear-gradient(180deg,#363c4b,#161a26);
      box-shadow:0 14px 18px rgba(38,42,57,.16);
      top:92px;
    }
    .ear.left{left:6px; transform:rotate(-10deg)}
    .ear.right{right:8px; transform:rotate(10deg)}
    .ear.right::before{
      content:"";
      position:absolute;
      inset:16px;
      border-radius:50%;
      background:radial-gradient(circle at center, rgba(255,109,74,.12) 0, rgba(255,109,74,.12) 45%, rgba(255,109,74,.04) 46%, rgba(255,109,74,0) 63%);
      box-shadow:inset 0 0 0 2px rgba(255,125,92,.25), 0 0 18px rgba(255,109,74,.18);
    }
    .ear.right::after{
      content:"Y";
      position:absolute;
      inset:0;
      display:flex; align-items:center; justify-content:center;
      color:#ff6e56;
      font-weight:800;
      font-size:42px;
      text-shadow:0 0 16px rgba(255,110,86,.45);
    }

    .thumbs{
      position:relative;
      margin:0 34px;
      padding:16px 18px;
      background:linear-gradient(180deg,rgba(252,252,255,.95),rgba(248,248,252,.98));
      border:1px solid var(--stroke);
      border-radius:24px;
      box-shadow:0 10px 20px rgba(42,48,76,.05);
      display:grid;
      grid-template-columns: 1fr auto;
      align-items:center;
      gap:24px;
      transform:translateY(-6px);
    }
    .thumbs-left{
      height:104px;
      border-radius:18px;
      background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(250,250,253,.7));
      border:1px solid rgba(235,236,243,.9);
    }
    .thumbs-right{
      display:flex;
      align-items:center;
      gap:18px;
      padding-right:6px;
    }
    .thumb-card{
      width:208px;
      height:104px;
      border-radius:18px;
      background:linear-gradient(180deg,#ffffff 0%, #f5f5fa 100%);
      border:1px solid rgba(227,229,239,.95);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 6px 18px rgba(42,48,76,.04);
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      cursor:pointer;
      position:relative;
      overflow:hidden;
    }
    .thumb-card:hover, .thumb-card.active{
      transform:translateY(-3px);
      box-shadow:0 14px 22px rgba(100,85,200,.1);
      border-color:rgba(141,116,255,.35);
    }
    .mini-mouse, .mini-box, .mini-headset{position:relative}
    .mini-mouse{width:42px;height:62px;border-radius:22px;background:linear-gradient(180deg,#495166,#202534)}
    .mini-mouse::after{content:"";position:absolute;bottom:9px;left:50%;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;border-right:2px solid #7f63ff;border-bottom:2px solid #7f63ff}
    .mini-box{width:52px;height:70px;border-radius:8px;background:linear-gradient(180deg,#3d4048 0 100%);box-shadow:inset -10px 0 0 rgba(0,0,0,.08)}
    .mini-box::after{content:"";position:absolute;right:-18px;top:8px;width:18px;height:54px;border-radius:0 6px 6px 0;background:linear-gradient(180deg,#e53333,#386fff)}
    .mini-headset{width:62px;height:66px;border:8px solid #2a2f3c;border-bottom:0;border-radius:38px 38px 0 0}
    .mini-headset::before,.mini-headset::after{content:"";position:absolute;top:34px;width:18px;height:30px;border-radius:10px;background:linear-gradient(180deg,#313748,#191d2a)}
    .mini-headset::before{left:-7px}
    .mini-headset::after{right:-7px}

    .nav-btn{
      width:56px;height:56px;border-radius:50%;
      display:grid;place-items:center;
      background:linear-gradient(180deg,#fcfcff,#efeff7);
      border:1px solid rgba(211,214,231,.95);
      color:#2d3040;
      font-size:30px;
      cursor:pointer;
      transition:all .18s ease;
    }
    .nav-btn:hover{transform:translateY(-2px); box-shadow:0 10px 18px rgba(82,86,111,.1); border-color:rgba(141,116,255,.32); color:#6a4fff}
    .page-indicator{
      min-width:86px;
      text-align:center;
      font-size:18px;
      color:#2c3040;
      font-weight:700;
    }

    .tabs{
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:12px;
      padding:14px 30px 18px;
      background:linear-gradient(180deg,#fff 0%, #fbfbfd 100%);
    }
    .tab{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      height:92px;
      border-radius:18px;
      background:linear-gradient(180deg,#ffffff,#f9f9fc);
      border:1px solid rgba(226,228,238,.95);
      color:#727588;
      font-size:24px;
      font-weight:700;
      cursor:pointer;
      transition:all .22s ease;
      overflow:hidden;
    }
    .tab:hover{transform:translateY(-2px); box-shadow:0 12px 20px rgba(71,77,101,.06)}
    .tab.active{
      color:#1f2230;
      border-color:rgba(131,108,255,.5);
      box-shadow:inset 0 0 0 1px rgba(131,108,255,.24), 0 12px 24px rgba(109,87,236,.07);
      background:linear-gradient(180deg,#ffffff,#faf7ff);
    }
    .tab.active::after{
      content:"";
      position:absolute;
      left:50%; transform:translateX(-50%);
      bottom:10px;
      width:40px;height:4px;border-radius:999px;
      background:linear-gradient(90deg,#7d62ff,#b486ff);
      box-shadow:0 0 8px rgba(122,85,255,.24);
    }

    .icon{
      width:28px;height:28px; display:inline-block;
      color:inherit;
      opacity:.92;
    }
    .icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    @media (max-width: 1500px){
      .title{font-size:62px}
      .desc{font-size:19px}
      .price .num{font-size:52px}
      .hero{grid-template-columns:1fr 1fr}
      .thumb-card{width:170px}
      .tab{font-size:20px}
    }
    @media (max-width: 1220px){
      body{padding:14px}
      .page{width:100%}
      .hero{grid-template-columns:1fr; padding:24px 24px 0}
      .right{min-height:420px}
      .thumbs{grid-template-columns:1fr; gap:16px; margin:0 24px}
      .thumbs-right{justify-content:center; flex-wrap:wrap}
      .tabs{grid-template-columns:repeat(2,1fr); padding:14px 24px 24px}
      .tooltip{right:18px; top:18px; min-width:280px}
      .laptop{right:180px; transform:scale(.88) skewX(-6deg) rotate(-2deg)}
      .keyboard{left:70px}
      .mouse{left:430px}
    }
    @media (max-width: 760px){
      .title{font-size:42px; letter-spacing:-1px}
      .desc{font-size:16px; line-height:1.6}
      .price .currency{font-size:24px}
      .price .num{font-size:40px}
      .price .suffix{font-size:20px}
      .cta{padding:14px 24px;font-size:18px}
      .right{min-height:340px}
      .tooltip{transform:scale(.82); transform-origin:top right}
      .laptop{right:95px; top:130px; transform:scale(.58) skewX(-6deg) rotate(-2deg)}
      .keyboard{left:18px; bottom:66px; transform:scale(.68) skewX(-26deg) rotate(-2deg); transform-origin:left bottom}
      .mouse{left:250px; bottom:58px; transform:scale(.8) rotate(-8deg)}
      .headset{right:-8px; top:160px; transform:scale(.76); transform-origin:top right}
      .shelves{left:40px; top:30px; transform:scale(.84); transform-origin:top left}
      .tabs{grid-template-columns:repeat(2,1fr); gap:10px}
      .tab{height:72px; font-size:17px; gap:10px}
      .thumb-card{width:120px; height:82px}
      .nav-btn{width:46px;height:46px}
    }
    .scene-photo{background:#030b20}
    .scene-photo::before{display:none}
    .banner-scene{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:65% center;
    }

    /* Controls belong to the image, not a separate row below the hero. */
    .scene-photo{min-width:0}
    .banner-controls{
      position:absolute;
      z-index:5;
      left:18px;right:18px;bottom:18px;
      padding:12px;
      border-radius:18px;
      background:rgba(248,249,255,.2);
      border:none;
      box-shadow:none;
    }
    .banner-controls .thumbs-right{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr)) 42px 56px 42px;
      gap:10px;padding:0;
    }

    const toneCanvas = document.createElement('canvas');

    const toneContext = toneCanvas.getContext('2d', { willReadFrequently: true });
    function updateControlsTone() {
      if (!toneContext || !image.complete || !image.naturalWidth) return;
      const bounds = image.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return;
      const first = previousButton.getBoundingClientRect();
      const last = nextButton.getBoundingClientRect();
      // Reproduce object-fit:cover and object-position:65% center.
      const scale = Math.max(bounds.width / image.naturalWidth, bounds.height / image.naturalHeight);
      const offsetX = (bounds.width - image.naturalWidth * scale) * .65;
      const offsetY = (bounds.height - image.naturalHeight * scale) * .5;
      const x = (first.left - bounds.left - offsetX) / scale;
      const y = (Math.min(first.top, last.top) - bounds.top - offsetY) / scale;
      const width = (last.right - first.left) / scale;
      const height = Math.max(first.height, last.height) / scale;
      if (width <= 0 || height <= 0) return;
      try {
        toneContext.drawImage(image, x, y, width, height, 0, 0, 32, 16);
        const pixels = toneContext.getImageData(0, 0, 32, 16).data;
        const linear = value => value <= .04045 ? value / 12.92 : Math.pow((value + .055) / 1.055, 2.4);
        let luminance = 0;
        for (let i = 0; i < pixels.length; i += 4) {
          // Account for the 20% white-tinted controls background.
          const r = linear((pixels[i] * .8 + 248 * .2) / 255);
          const g = linear((pixels[i + 1] * .8 + 249 * .2) / 255);
          const b = linear((pixels[i + 2] * .8 + 255 * .2) / 255);
          luminance += .2126 * r + .7152 * g + .0722 * b;
        }
        luminance /= pixels.length / 4;
        const lightContrast = 1.05 / (luminance + .05);
        const darkContrast = (luminance + .05) / (.021 + .05);
        controls.dataset.tone = lightContrast > darkContrast ? 'dark' : 'light';
      } catch {
        // Current images are embedded; retain the last safe tone if a future external asset blocks sampling.

      if (tooltip.hidden || !image.complete || !image.naturalWidth) return;
      const width = image.clientWidth;
      const height = image.clientHeight;
      if (!width || !height) return;
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const renderedWidth = image.naturalWidth * scale;

      const anchorX = (width - renderedWidth) * .65 + renderedWidth * callout.x;

      tooltip.style.top = `${top}px`;

      calloutObserver.observe(tooltip);

    if (document.fonts) document.fonts.ready.then(positionProductCallout);

    function setSceneLabel(sceneName) {
      tag.replaceChildren();
      const sparkle = document.createElement('span');
      sparkle.className = 'sparkle';
      tag.append(sparkle, document.createTextNode(sceneName));
