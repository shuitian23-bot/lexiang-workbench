<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>leaip0 · 联想乐享</title>
    <style>
      :root {
        --page-bg: #f7f3fa;
        --surface: #fff;
        --border: #e6dfea;
        --text: #101010;
        --muted: #746d78;
        --aubergine: #5b1452;
        --brand-red: #e42b20;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background: var(--page-bg);
        font-family: "Source Han Sans CN", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      main {
        width: min(560px, 100%);
        padding: 32px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(50, 29, 57, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 26px;
        color: var(--aubergine);
        font-size: 15px;
        font-weight: 700;
      }

      .brand-mark {
        width: 5px;
        height: 22px;
        border-radius: 2px;
        background: linear-gradient(180deg, var(--brand-red), var(--aubergine));
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 11px;
        color: var(--aubergine);
        background: #f6f1f8;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2f9e44;
      }

      h1 {
        margin: 20px 0 10px;
        font-size: 28px;
        line-height: 1.3;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      code {
        color: var(--aubergine);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>联想乐享</div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span>访问正常</div>
      <h1>leaip0 已就绪</h1>
      <p>该目录已成功发布，可通过 <code>/leaip0/</code> 继续部署页面和静态资源。</p>
    </main>
  </body>
</html>
