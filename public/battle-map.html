    --lx-border: #DED6E3;
    --lx-text: #2B2230;
    --lx-text-secondary: #5C4F63;
    --lx-text-tertiary: #8A7C91;

    --status-doing: #1565C0;

  body {

  }
  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--lx-border);
    margin-bottom: 10px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand .name {
    font-size: 18px;
    font-weight: 700;
    color: var(--lx-brand-red);
  }
  .brand .sub {
    font-size: 14px;
    color: var(--lx-text-secondary);
  }
  .back-home {
    font-size: 13px;
    color: var(--lx-aubergine);
    text-decoration: none;
    padding: 6px 14px;
    border: 1px solid var(--lx-border);
    border-radius: 6px;
    background: var(--lx-surface);
  }
  .back-home:hover { background: var(--lx-surface-muted); }

  .meta-line {
    font-size: 12px;
    color: var(--lx-text-tertiary);
    padding: 10px 0 24px;
  }
  .legend-item { margin-right: 14px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .dot-done { background: var(--status-done); }
  .dot-doing { background: var(--status-doing); }
  .dot-todo { background: var(--status-todo); }
  .dot-tbd { background: var(--status-tbd); }

  .section { margin: 32px 0; }
  .section-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--lx-aubergine);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--lx-border);
  }

  /* 矩阵 */
  .matrix-wrap {
    overflow-x: auto;
    background: var(--lx-surface);
    border: 1px solid var(--lx-border);
    border-radius: 10px;
    padding: 6px;
  }
  table.matrix { border-collapse: collapse; width: 100%; min-width: 960px; }
  .matrix th, .matrix td { border: 1px solid var(--lx-border); padding: 8px 10px; text-align: center; vertical-align: middle; }
  .matrix thead th { background: var(--lx-surface-muted); }
  .corner { text-align: left; font-size: 12px; color: var(--lx-text-tertiary); position: sticky; left: 0; z-index: 2; background: var(--lx-surface-muted); }
  .mx-colhead { min-width: 130px; }
  .colname { font-weight: 700; font-size: 13px; }
  .colpm { font-size: 11px; color: var(--lx-text-tertiary); margin-top: 2px; }
  .mx-rowhead {
    text-align: left; min-width: 140px; background: var(--lx-surface-muted);
    position: sticky; left: 0; z-index: 1;
  }
  .rowname { font-weight: 700; font-size: 13px; }
  .rowpm { font-size: 11px; color: var(--lx-text-tertiary); margin-top: 2px; }
  .mx-cell { transition: box-shadow .15s ease, transform .15s ease; }
  .mx-cell.has-data { cursor: pointer; }
  .mx-cell.has-data:hover { box-shadow: 0 4px 12px rgba(78,22,70,.18); transform: translateY(-2px); position: relative; }
  .mx-count { font-weight: 700; font-size: 14px; color: var(--lx-aubergine); }
  .mx-empty { color: var(--lx-text-tertiary); font-size: 13px; }
  .mini-bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 4px; background: var(--lx-surface-muted); }
  .bar-seg { height: 100%; }
  .bar-done { background: var(--status-done); }
  .bar-doing { background: var(--status-doing); }
  .bar-todo { background: var(--status-todo); }
  .bar-tbd { background: var(--status-tbd); }

  /* 徽章 */
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; line-height: 1.7; white-space: nowrap; }
  .badge-pm { background: var(--lx-surface-muted); color: var(--lx-text-secondary); margin-left: 8px; font-weight: 400; }
  .badge-prd { background: var(--lx-surface-muted); color: var(--lx-text-secondary); border: 1px solid var(--lx-border); font-family: Consolas, "SFMono-Regular", monospace; }
  .badge-pri.pri-p0 { background: var(--lx-aubergine); color: #fff; border: 1px solid var(--lx-aubergine); font-weight: 600; }
  .badge-pri.pri-p1 { background: #fff; color: var(--lx-aubergine); border: 1px solid var(--lx-aubergine); }
  .badge-pri.pri-p2 { background: var(--lx-surface-muted); color: var(--lx-text-tertiary); border: 1px solid var(--lx-border); }
  .badge-pri.pri-none { background: var(--lx-surface-muted); color: var(--lx-text-tertiary); border: 1px solid var(--lx-border); }
  .badge-status { color: #fff; font-weight: 500; }
  .badge-status.status-done { background: var(--status-done); }
  .badge-status.status-doing { background: var(--status-doing); }
  .badge-status.status-todo { background: var(--status-todo); }
  .badge-status.status-tbd { background: var(--status-tbd); }
  .badge-lead { background: #fff; border: 1px solid var(--lx-brand-red); color: var(--lx-brand-red); }
  .badge-side { background: var(--lx-surface-muted); color: var(--lx-text-secondary); }

  /* 明细区 */
  .detail-group { margin-bottom: 30px; }
  .detail-group-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .detail-sub { margin: 0 0 18px 0; }
  .detail-sub-title { font-size: 13px; font-weight: 700; color: var(--lx-text-secondary); margin-bottom: 8px; }
  .feature-list { display: flex; flex-direction: column; gap: 8px; }
  .feature-card {
    background: var(--lx-surface); border: 1px solid var(--lx-border); border-left: 4px solid var(--lx-border);
    border-radius: 6px; padding: 10px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
    outline: 3px solid transparent; outline-offset: 3px;

  .feature-card.status-border-done { border-left-color: var(--status-done); }
  .feature-card.status-border-doing { border-left-color: var(--status-doing); }
  .feature-card.status-border-todo { border-left-color: var(--status-todo); }
  .feature-card.status-border-tbd { border-left-color: var(--status-tbd); }
  .feature-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .feature-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .feature-note { font-size: 12px; color: var(--lx-text-tertiary); margin-top: 6px; }
  @keyframes lxFlash {
    0%, 100% { outline-color: transparent; }
    20%, 60% { outline-color: var(--lx-brand-red); }
  }
  .feature-card.flash, .detail-sub.flash .feature-card { animation: lxFlash 2s ease-in-out; }

  /* 按人视图 */
  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .person-card { background: var(--lx-surface); border: 1px solid var(--lx-border); border-radius: 10px; padding: 14px 16px; }
  .person-head { display: flex; align-items: center; margin-bottom: 8px; }
  .person-name { font-weight: 700; font-size: 15px; }
  .person-groups { font-size: 12px; color: var(--lx-text-secondary); margin-bottom: 10px; min-height: 32px; }
  .person-total { font-size: 13px; color: var(--lx-text); margin-bottom: 8px; }
  .person-total b { color: var(--lx-aubergine); font-size: 16px; }
  .person-stats { display: flex; flex-wrap: wrap; gap: 6px; }
  .mini-stat { font-size: 11px; padding: 2px 7px; border-radius: 8px; color: #fff; }
  .mini-stat.mini-done { background: var(--status-done); }
  .mini-stat.mini-doing { background: var(--status-doing); }
  .mini-stat.mini-todo { background: var(--status-todo); }

  .tbd-name { font-weight: 700; color: var(--lx-brand-red); margin-bottom: 4px; font-size: 14px; }
  .tbd-why { font-size: 13px; color: var(--lx-text-secondary); margin-bottom: 6px; }

  .support-section { background: var(--lx-surface); border: 1px solid var(--lx-border); border-radius: 10px; padding: 20px 24px; }
  .support-note { font-size: 13px; color: var(--lx-text-tertiary); margin-bottom: 14px; }
  .support-items { display: flex; flex-direction: column; gap: 8px; }

  .support-item:last-child { border-bottom: none; }
  .support-item-name { font-weight: 600; }
  .support-item-note { color: var(--lx-text-tertiary); font-size: 12px; }

  .foot-note { margin-top: 28px; font-size: 12px; color: var(--lx-text-tertiary); text-align: center; }
</style>

      { "name": "留资工单后台（admin 面板）", "prd": "5.X", "pri": "P1", "status": "todo", "note": "易漏：前端有表单，后台待补" }
    ],
    "leads:cs": [
      { "name": "线索转销售跟进协同", "prd": "风险表", "pri": "P1", "status": "todo", "note": "需明确线下责任人" }
    ],
    "multimodal:shop": [
      { "name": "图片理解（拍照问机）", "prd": "5.1", "pri": "P1", "status": "done", "note": "火山 vision" },
      { "name": "语音交互（豆包流式 ASR）", "prd": "—", "pri": "P1", "status": "done" },
      { "name": "深度思考 / 联网搜索开关", "prd": "5.1", "pri": "P1", "status": "done" }
    ],
    "multimodal:biz": [
      { "name": "多模态能力 b/biz 复用", "prd": "5.1", "pri": "P1", "status": "done" }
    ],
    "device:shop": [
      { "name": "移动端 / 端侧形态", "prd": "L889 风险项", "pri": "—", "status": "tbd", "note": "PRD 仅标「后续规划」，需产出端侧章节" }
    ]
  },
  "support": {
    "title": "支撑层：运营后台（5.12，P1，内部）",
    "note": "不属于任何单一场景，横向支撑，负责人待定",
    "items": [
      { "name": "商品与内容管理", "status": "doing" },
      { "name": "营销活动配置（lxhint/seckill 已有）", "status": "doing" },
      { "name": "数据看板与质量分析", "status": "doing", "note": "质量数据 mock" },
      { "name": "A/B 实验能力", "status": "todo" },
      { "name": "后台 AI 助手", "status": "todo" }
    ]
  },
  "tbd": [
    { "name": "支付流程载体归属", "why": "PRD 3 处标 TBD，售中售后全链路被卡", "lead": "王双凤 × 董兹毓" },
    { "name": "国补叠加规则建模（顺序/上限/可叠项）", "why": "国补价展示、会员权益叠加均被卡", "lead": "王双凤 × 张雪莹" },
    { "name": "分期机制（期数/规则）", "why": "PRD 标待核实", "lead": "王双凤" },
    { "name": "晒单返现机制", "why": "PRD 标待核实", "lead": "张雪莹" },
    { "name": "留资工单后台", "why": "前端表单已有，后台无人认领", "lead": "王雅婷" },
    { "name": "惠采订单/发票工作台（P2）", "why": "依赖财务法务，易被漏排", "lead": "王新婷 × 张蕊" },
    { "name": "端侧/移动端规划", "why": "PRD 无章节", "lead": "张伟业" },
    { "name": "运营后台定责", "why": "5.12 整章无负责人", "lead": "待定" }
  ]
};
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var STATUS_ORDER = ['done', 'doing', 'todo', 'tbd'];

  function cellKey(rowId, colId) { return rowId + ':' + colId; }
  function getCell(rowId, colId) { return DATA.cells[cellKey(rowId, colId)] || null; }

  function statusBadge(status) {
    var label = DATA.statusMap[status] || status;
    return '<span class="badge badge-status status-' + esc(status) + '">' + esc(label) + '</span>';
  }
  function priBadge(pri) {
    if (!pri || pri === '—') return '<span class="badge badge-pri pri-none">—</span>';
    var cls = pri === 'P0' ? 'pri-p0' : (pri === 'P1' ? 'pri-p1' : 'pri-p2');
    return '<span class="badge badge-pri ' + cls + '">' + esc(pri) + '</span>';
  }
  function prdBadge(prd) {
    return '<span class="badge badge-prd">' + esc(prd || '—') + '</span>';
  }

  /* ---- 头部图例 ---- */
  function renderMeta() {
    var legend = STATUS_ORDER.map(function (s) {
      return '<span class="legend-item"><span class="dot dot-' + s + '"></span>' + esc(DATA.statusMap[s]) + '</span>';
    }).join('');
    document.getElementById('metaLine').innerHTML =
      '数据基线：' + esc(DATA.prdVersion) + ' · 更新于 ' + esc(DATA.updated) + ' · ' + legend;
  }

  /* ---- 矩阵 ---- */
  function statusCounts(items) {
    var c = { done: 0, doing: 0, todo: 0, tbd: 0 };
    items.forEach(function (it) { if (c.hasOwnProperty(it.status)) c[it.status]++; });
    return c;
  }
  function miniBar(items) {
    var counts = statusCounts(items);
    var total = items.length || 1;
    var segs = STATUS_ORDER.map(function (s) {
      var w = counts[s] / total * 100;
      if (w <= 0) return '';
      return '<span class="bar-seg bar-' + s + '" style="width:' + w.toFixed(2) + '%"></span>';
    }).join('');
    return '<div class="mini-bar">' + segs + '</div>';
  }

  function renderMatrix() {
    var thead = '<thead><tr><th class="corner">场景 × 商城域</th>' +
      DATA.cols.map(function (col) {
        return '<th class="mx-colhead"><div class="colname">' + esc(col.name) + '</div><div class="colpm">' + esc(col.pm) + '</div></th>';
      }).join('') + '</tr></thead>';

    var tbody = '<tbody>' + DATA.rows.map(function (row) {
      var tds = DATA.cols.map(function (col) {
        var items = getCell(row.id, col.id);
        if (items && items.length) {
          return '<td class="mx-cell has-data" data-row="' + row.id + '" data-col="' + col.id + '">' +
            '<span class="mx-count">' + items.length + '</span>' + miniBar(items) + '</td>';
        }
        return '<td class="mx-cell mx-empty">—</td>';
      }).join('');
      return '<tr><th class="mx-rowhead"><div class="rowname">' + esc(row.name) + '</div><div class="rowpm">' + esc(row.pm) + '</div></th>' + tds + '</tr>';
    }).join('') + '</tbody>';

    var table = document.getElementById('matrixTable');
    table.innerHTML = thead + tbody;
    table.addEventListener('click', function (e) {
      var cell = e.target.closest ? e.target.closest('.mx-cell.has-data') : null;
      if (!cell) return;
      var target = document.getElementById('cell-' + cell.getAttribute('data-row') + '-' + cell.getAttribute('data-col'));
      if (!target) return;
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.remove('flash');
      void target.offsetWidth;
      target.classList.add('flash');
      setTimeout(function () { target.classList.remove('flash'); }, 2000);
    });
  }

  /* ---- 明细区 ---- */
  function featureCard(item) {
    var html = '<div class="feature-card status-border-' + esc(item.status) + '">' +
      '<div class="feature-name">' + esc(item.name) + '</div>' +
      '<div class="feature-meta">' + prdBadge(item.prd) + priBadge(item.pri) + statusBadge(item.status) + '</div>';
    if (item.note) html += '<div class="feature-note">' + esc(item.note) + '</div>';
    html += '</div>';
    return html;
  }

  function renderDetail() {
    var html = DATA.rows.map(function (row) {
      var subs = DATA.cols.map(function (col) {
        var items = getCell(row.id, col.id);
        if (!items || !items.length) return '';
        return '<div class="detail-sub" id="cell-' + row.id + '-' + col.id + '">' +
          '<div class="detail-sub-title">× ' + esc(col.name) + '（' + esc(col.pm) + '）</div>' +
          '<div class="feature-list">' + items.map(featureCard).join('') + '</div>' +
          '</div>';
      }).join('');
      if (!subs) return '';
      return '<div class="detail-group">' +
        '<div class="detail-group-title">' + esc(row.name) + '<span class="badge badge-pm">PM ' + esc(row.pm) + '</span></div>' +
        subs + '</div>';
    }).join('');
    document.getElementById('detailList').innerHTML = html;
  }

  /* ---- 按人视图 ---- */
  function aggregateSide(list, sideLabel) {
    var map = {};
    var order = [];
    list.forEach(function (entry) {
      if (!map[entry.pm]) { map[entry.pm] = { name: entry.pm, side: sideLabel, groups: [], ids: [] }; order.push(entry.pm); }
      map[entry.pm].groups.push(entry.name);
      map[entry.pm].ids.push(entry.id);
    });
    return order.map(function (k) { return map[k]; });
  }
  function personStats(person, keyIndex) {
    var total = 0, counts = { done: 0, doing: 0, todo: 0, tbd: 0 };
    Object.keys(DATA.cells).forEach(function (key) {
      var parts = key.split(':');
      var matchId = parts[keyIndex];
      if (person.ids.indexOf(matchId) < 0) return;
      DATA.cells[key].forEach(function (it) {
        total++;
        if (counts.hasOwnProperty(it.status)) counts[it.status]++;
      });
    });
    return { total: total, counts: counts };
  }
  function personCard(person, keyIndex) {
    var stats = personStats(person, keyIndex);
    var stat = stats.counts;
    return '<div class="person-card">' +
      '<div class="person-head"><span class="person-name">' + esc(person.name) + '</span><span class="badge badge-side">' + esc(person.side) + '</span></div>' +
      '<div class="person-groups">' + esc(person.groups.join('、')) + '</div>' +
      '<div class="person-total">功能点合计 <b>' + stats.total + '</b></div>' +
      '<div class="person-stats">' +
        '<span class="mini-stat mini-done">' + esc(DATA.statusMap.done) + ' ' + stat.done + '</span>' +
        '<span class="mini-stat mini-doing">' + esc(DATA.statusMap.doing) + ' ' + stat.doing + '</span>' +
        '<span class="mini-stat mini-todo">' + esc(DATA.statusMap.todo) + ' ' + stat.todo + '</span>' +
        '<span class="mini-stat mini-tbd">' + esc(DATA.statusMap.tbd) + ' ' + stat.tbd + '</span>' +
      '</div>' +
      '</div>';
  }
  function renderPeople() {
    var lxPeople = aggregateSide(DATA.rows, '乐享 PM');
    var mallPeople = aggregateSide(DATA.cols, '商城 PM');
    var html = lxPeople.map(function (p) { return personCard(p, 0); }).join('') +
      mallPeople.map(function (p) { return personCard(p, 1); }).join('');
    document.getElementById('peopleGrid').innerHTML = html;
  }

  /* ---- 待定作战项 ---- */
  function renderTbd() {
    var html = (DATA.tbd || []).map(function (t) {
      return '<div class="tbd-item">' +
        '<div class="tbd-name">' + esc(t.name) + '</div>' +
        '<div class="tbd-why">' + esc(t.why) + '</div>' +
        '<span class="badge badge-lead">建议牵头：' + esc(t.lead) + '</span>' +
        '</div>';
    }).join('');
    document.getElementById('tbdList').innerHTML = html || '<p>暂无待定案事项。</p>';
  }

  /* ---- 支撑层 ---- */
  function renderSupport() {
    var s = DATA.support;
    if (!s) return;
    var items = (s.items || []).map(function (it) {
      return '<div class="support-item">' +
        '<span class="support-item-name">' + esc(it.name) + '</span>' +
        statusBadge(it.status) +
        (it.note ? '<span class="support-item-note">' + esc(it.note) + '</span>' : '') +
        '</div>';
    }).join('');
    document.getElementById('supportSection').innerHTML =
      '<div class="section-title">' + esc(s.title) + '</div>' +
      '<p class="support-note">' + esc(s.note) + '</p>' +
      '<div class="support-items">' + items + '</div>';
  }

  renderMeta();
  renderMatrix();
  renderDetail();
  renderPeople();
  renderTbd();
  renderSupport();
})();
</script>
</body>
</html>
