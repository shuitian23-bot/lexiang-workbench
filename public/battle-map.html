<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐享+ 5.0 人力作战地图 - 联想乐享</title>
<style>
  :root {
    --lx-brand-red: #B8252E;
    --lx-aubergine: #4E1646;
    --lx-bg: #F7F3FA;
    --lx-surface: #FFFFFF;
    --lx-surface-muted: #F1EDF4;
    --lx-border: #DED6E3;
    --lx-text: #2B2230;
    --lx-text-secondary: #5C4F63;
    --lx-text-tertiary: #8A7C91;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Source Han Sans CN", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background: var(--lx-bg);
    color: var(--lx-text);
    line-height: 1.6;
  }
  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--lx-border);
    margin-bottom: 10px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand .name {
    font-size: 18px;
    font-weight: 700;
    color: var(--lx-brand-red);
  }
  .brand .sub {
    font-size: 14px;
    color: var(--lx-text-secondary);
  }
  .back-home {
    font-size: 13px;
    color: var(--lx-aubergine);
    text-decoration: none;
    padding: 6px 14px;
    border: 1px solid var(--lx-border);
    border-radius: 6px;
    background: var(--lx-surface);
  }
  .back-home:hover { background: var(--lx-surface-muted); }

  .meta-line {
    font-size: 12px;
    color: var(--lx-text-tertiary);
    padding: 10px 0 24px;
  }
  .meta-line .legend-row { margin-top: 8px; }
  .meta-line .legend-row .badge { margin-right: 8px; }

  .section { margin: 32px 0; }
  .section-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--lx-aubergine);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--lx-border);
  }
  .sub-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--lx-text-secondary);
    margin: 20px 0 10px;
  }
  .sub-title:first-child { margin-top: 0; }

  /* 徽章 */
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; line-height: 1.7; white-space: nowrap; }
  .badge-pri.pri-p0 { background: var(--lx-brand-red); color: #fff; font-weight: 600; }
  .badge-pri.pri-p1 { background: #fff; border: 1px solid var(--lx-brand-red); color: var(--lx-brand-red); }
  .badge-pri.pri-p2 { background: var(--lx-surface-muted); color: var(--lx-text-tertiary); border: 1px solid var(--lx-border); }
  .badge-unclaimed { background: var(--lx-brand-red); color: #fff; }
  .badge-owner { background: #F1E4F5; color: var(--lx-aubergine); border-radius: 4px; padding: 2px 8px; font-size: 12px; display: inline-block; }
  .badge-lead { background: #fff; border: 1px solid var(--lx-aubergine); color: var(--lx-aubergine); }
  .badge-lead.unclaimed { background: var(--lx-brand-red); color: #fff; border-color: var(--lx-brand-red); }

  /* 板块一：功能 × 场景矩阵 */
  .matrix-wrap {
    overflow-x: auto;
    background: var(--lx-surface);
    border: 1px solid var(--lx-border);
    border-radius: 10px;
    padding: 6px;
  }
  table.matrix { border-collapse: collapse; width: 100%; }
  .matrix th, .matrix td { border: 1px solid var(--lx-border); padding: 8px 10px; text-align: left; vertical-align: top; min-width: 108px; }
  .matrix thead th { background: var(--lx-surface-muted); text-align: center; }
  .matrix .corner { text-align: left; font-size: 12px; color: var(--lx-text-tertiary); min-width: 150px; }
  .matrix .zhangyi-col { background: #EFE3F5; }
  .colname { font-weight: 700; font-size: 13px; }
  .colpm { font-size: 11px; color: var(--lx-text-tertiary); margin-top: 2px; }
  .mx-rowhead { background: var(--lx-surface-muted); min-width: 150px; }
  .mx-rowhead.rowhead-p0 { border-left: 3px solid var(--lx-brand-red); }
  .rowname { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .cell-item { font-size: 12px; }
  .cell-item + .cell-item { margin-top: 3px; }
  .cell-empty { text-align: center; color: var(--lx-text-tertiary); vertical-align: middle; }

  /* 板块二：官网侧 */
  .subsite-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .subsite-card { background: var(--lx-surface); border: 1px solid var(--lx-border); border-radius: 10px; padding: 16px; }
  .subsite-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--lx-border); }
  .subsite-name { font-weight: 700; font-size: 15px; }
  .tab-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 13px; }
  .tab-row:not(:last-child) { border-bottom: 1px dashed var(--lx-border); }

  .pages-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  table.pages-table { width: 100%; border-collapse: collapse; }
  .pages-table td { padding: 8px 6px; border-bottom: 1px solid var(--lx-surface-muted); font-size: 13px; }
  .pages-table td:last-child { text-align: right; }

  /* 板块三：按人看工作量 */
  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .person-card { background: var(--lx-surface); border: 1px solid var(--lx-border); border-radius: 10px; padding: 14px 16px; }
  .person-name { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .person-groups { font-size: 12px; color: var(--lx-text-secondary); margin-bottom: 8px; min-height: 32px; }
  .person-count { font-size: 13px; color: var(--lx-text); }
  .person-count b { color: var(--lx-aubergine); font-size: 16px; }
  .pool-note { font-size: 12px; color: var(--lx-text-tertiary); margin-top: 18px; }
  .pool-flag { color: var(--lx-brand-red); font-weight: 600; }

  /* 板块四：待定案作战项 */
  .tbd-section {
    background: #FDF0F0; border-left: 4px solid var(--lx-brand-red); border-radius: 8px;
    padding: 20px 24px; margin: 32px 0;
  }
  .tbd-section .section-title { border-bottom: none; margin-bottom: 10px; padding-bottom: 0; color: var(--lx-brand-red); }
  .tbd-item { padding: 12px 0; border-bottom: 1px dashed rgba(184,37,46,.25); }
  .tbd-item:last-child { border-bottom: none; }
  .tbd-name { font-weight: 700; color: var(--lx-brand-red); margin-bottom: 4px; font-size: 14px; }
  .tbd-why { font-size: 13px; color: var(--lx-text-secondary); margin-bottom: 6px; }

  .foot-note { margin-top: 28px; font-size: 12px; color: var(--lx-text-tertiary); text-align: center; }
</style>
</head>

(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function priBadge(pri) {
    var cls = pri === 'P0' ? 'pri-p0' : (pri === 'P1' ? 'pri-p1' : 'pri-p2');
    return '<span class="badge badge-pri ' + cls + '">' + esc(pri) + '</span>';
  }
  function unclaimedBadge() {
    return '<span class="badge badge-unclaimed">待认领</span>';
  }
  function ownerBadge(name) {
    if (!name) return unclaimedBadge();
    return '<span class="badge badge-owner">' + esc(name) + '</span>';
  }

  /* ---- 基线行 + 图例 ---- */
  function renderMeta() {
    var legend = '图例：' + priBadge('P0') + priBadge('P1') + priBadge('P2');
    document.getElementById('metaLine').innerHTML =
      '<div>数据源：' + esc(DATA.source) + ' · 更新于 ' + esc(DATA.updated) + '</div>' +
      '<div class="legend-row">' + legend + '</div>';
  }

  /* ---- 板块一：乐享侧功能 × 场景矩阵 ---- */
  function renderMatrix() {
    var thead = '<thead><tr><th class="corner">平台功能 × 场景</th>' +
      DATA.lxScenes.map(function (scene) {
        var cls = 'mx-colhead' + (scene.id === 'zhangyi' ? ' zhangyi-col' : '');
        return '<th class="' + cls + '"><div class="colname">' + esc(scene.name) + '</div><div class="colpm">' + esc(scene.pm) + '</div></th>';
      }).join('') + '</tr></thead>';

    var tbody = '<tbody>' + DATA.lxFuncs.map(function (func) {
      var rowCls = 'mx-rowhead' + (func.pri === 'P0' ? ' rowhead-p0' : '');
      var tds = DATA.lxScenes.map(function (scene) {
        var val = func.cells && func.cells[scene.id];
        if (val) {
          var items = val.split('｜').map(function (t) {
            return '<div class="cell-item">· ' + esc(t) + '</div>';
          }).join('');
          return '<td>' + items + '</td>';
        }
        return '<td class="cell-empty">·</td>';
      }).join('');
      return '<tr><th class="' + rowCls + '"><div class="rowname">' + esc(func.name) + '</div>' + priBadge(func.pri) + '</th>' + tds + '</tr>';
    }).join('') + '</tbody>';

    document.getElementById('matrixTable').innerHTML = thead + tbody;
  }

  /* ---- 板块二 a：三子站首页 ---- */
  function renderSubsites() {
    var html = DATA.webSubsites.map(function (site) {
      var tabs = site.tabs.map(function (tab) {
        return '<div class="tab-row"><span>' + esc(tab.name) + '</span>' + ownerBadge(tab.owner) + '</div>';
      }).join('');
      return '<div class="subsite-card">' +
        '<div class="subsite-head"><span class="subsite-name">' + esc(site.name) + '</span>' + ownerBadge(site.owner) + '</div>' +
        tabs + '</div>';
    }).join('');
    document.getElementById('subsiteGrid').innerHTML = html;
  }

  /* ---- 板块二 b：功能页面 ---- */
  function pagesTable(list) {
    return '<table class="pages-table"><tbody>' + list.map(function (p) {
      return '<tr><td>' + esc(p.name) + '</td><td>' + ownerBadge(p.owner) + '</td></tr>';
    }).join('') + '</tbody></table>';
  }
  function renderPages() {
    var mid = Math.ceil(DATA.webPages.length / 2);
    var left = DATA.webPages.slice(0, mid);
    var right = DATA.webPages.slice(mid);
    document.getElementById('pagesWrap').innerHTML = pagesTable(left) + pagesTable(right);
  }

  /* ---- 板块三：按人看工作量 ---- */
  function renderLxPeople() {
    var map = {}, order = [];
    DATA.lxScenes.forEach(function (scene) {
      if (!map[scene.pm]) { map[scene.pm] = { name: scene.pm, scenes: [], sceneIds: [] }; order.push(scene.pm); }
      map[scene.pm].scenes.push(scene.name);
      map[scene.pm].sceneIds.push(scene.id);
    });
    var html = order.map(function (pm) {
      var person = map[pm];
      var count = 0;
      DATA.lxFuncs.forEach(function (func) {
        person.sceneIds.forEach(function (sid) {
          var val = func.cells && func.cells[sid];
          if (val) count += val.split('｜').length;
        });
      });
      return '<div class="person-card">' +
        '<div class="person-name">' + esc(person.name) + '</div>' +
        '<div class="person-groups">' + esc(person.scenes.join('、')) + '</div>' +
        '<div class="person-count">落地点条目数 <b>' + count + '</b></div>' +
        '</div>';
    }).join('');
    document.getElementById('lxPeopleGrid').innerHTML = html;
  }

  function collectWebOwners() {
    var list = [];
    DATA.webSubsites.forEach(function (site) {
      if (site.owner) list.push(site.owner);
      site.tabs.forEach(function (tab) { if (tab.owner) list.push(tab.owner); });
    });
    DATA.webPages.forEach(function (p) { if (p.owner) list.push(p.owner); });
    return list;
  }
  function renderWebPeople() {
    var list = collectWebOwners();
    var map = {}, order = [];
    list.forEach(function (name) {
      if (!map[name]) { map[name] = 0; order.push(name); }
      map[name]++;
    });
    var html = order.map(function (name) {
      return '<div class="person-card">' +
        '<div class="person-name">' + esc(name) + '</div>' +
        '<div class="person-count">分工条目数 <b>' + map[name] + '</b></div>' +
        '</div>';
    }).join('');
    document.getElementById('webPeopleGrid').innerHTML = html;

    var poolHtml = DATA.webPool.map(function (fullName) {
      var found = list.some(function (x) {
        return x.indexOf(fullName) >= 0 || fullName.indexOf(x) >= 0;
      });
      if (found) return esc(fullName);
      return '<span class="pool-flag">' + esc(fullName) + '</span>';
    }).join('、');
    document.getElementById('poolNote').innerHTML = esc(DATA.webPoolNote) + ' 人员池：' + poolHtml;
  }

  /* ---- 板块四：待定案作战项 ---- */
  function leadBadge(lead) {
    var cls = (lead === '待认领' || lead === '待定') ? ' unclaimed' : '';
    return '<span class="badge badge-lead' + cls + '">' + esc(lead) + '</span>';
  }
  function renderTbd() {
    var html = (DATA.tbd || []).map(function (t) {
      return '<div class="tbd-item">' +
        '<div class="tbd-name">' + esc(t.name) + '</div>' +
        '<div class="tbd-why">' + esc(t.why) + '</div>' +
        '<div>建议牵头：' + leadBadge(t.lead) + '</div>' +
        '</div>';
    }).join('');
    document.getElementById('tbdList').innerHTML = html || '<p>暂无待定案事项。</p>';
  }

  renderMeta();
  renderMatrix();
  renderSubsites();
  renderPages();
  renderLxPeople();
  renderWebPeople();
  renderTbd();
})();
</script>
</body>
</html>
