<!DOCTYPE html>
<html lang="zh-CN" data-product="leaibot-preview-redirect">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=workbench.html?demo=1">
  <title>正在进入乐享 AI 工作台</title>
  <style>
    :root {
      --primary: #3370ff;
      --bg: #f5f6f8;
      --surface: #fff;
      --border: #dde1e6;
      --text: #1f2329;
      --muted: #646a73;
      --red: #e2001a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--text);
      background: var(--bg);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(520px, 100%);
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 16px 36px rgba(31,35,41,.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: var(--red);
      font-weight: 800;
    }
    p { margin: 8px 0 0; color: var(--muted); }
    a { color: var(--primary); text-decoration: none; }
  </style>
  <script>
    location.replace('workbench.html?demo=1');
  </script>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">L</span><span>乐享 AI 工作台</span></div>
    <p>正在进入工作台演示页面。若未自动跳转，请 <a href="workbench.html?demo=1">点击这里打开</a>。</p>
  </main>
</body>
</html>
